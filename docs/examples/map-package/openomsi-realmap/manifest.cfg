# openOMSI map package (docs/OPENOMSI-MAP-PACKAGE-SPEC.md), generated by tools/exportar_openomsi_realmap.py
format    = 1
name      = RMG Leste
# the author's tile grid in metres: x = tile column * grid + position in the tile
grid      = 585.795
credit    = (c) OpenStreetMap contributors (ODbL)
# Colours are optional: a key left out takes the game's own dark / light look.
# `water = #rrggbb` colours the dark map, `light_water = #rrggbb` the light one.
# keys: land water river green grass forest sport farm built rail rail_edge border

# the player's marker on the maps: a triangle, white without a timetable, RMTC blue on a normal
# line, dark green on a BRT line (the lines named in brt_lines)
player      = triangle
player_free = #ffffff
player_line = #5588c7
player_brt  = #1e7b34
brt_lines   = 110, 111, 120
